[project]
name = "hackathon"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Juan Francisco Rodriguez Hernandez", email = "juanfrh7@icloud.com"},
]
dependencies = [
    "numpy>=2.5.4",
    "qiskit",
    "torch",
    "h5py>=3.16.0",
    "pandas>=3.0.6",
]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
